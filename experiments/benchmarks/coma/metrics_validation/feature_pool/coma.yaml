# @package _global_
# Shared 17-feature contextual-relevance pool for the CoMa benchmark.
#
# Included by every metric-validation config via a defaults-group `@package`
# override, so the feature definitions live in exactly one place. Each feature is
# a plain SampleMetric declared with `_partial_: true` (a zero-arg factory): the
# score-matrix scorer calls it lazily on a cache miss, and LearnedEnsembleMetric
# instantiates only the features its trained model needs. Context paths come from
# the root `${paths.ctx}`, so retargeting to a new dataset is a single override.
_feature_pool:
  # ── base-9 scalar ──
  direction_nearest:
    _target_: src.sample_metric.MassingContextualRelevance
    _partial_: true
    massing_key: massing
    context_key: context_ids_100
    additional_features: [site_contour]
    id_key: id
    context_reduction: nearest
    massing_metric:
      _target_: src.sample_metric.MassingFootprintsMetric
      massing_key: massing
      reduction: mean
      polygons_metric: {_target_: src.polygons_analyzer.DirectionPA}
    context_dataset_loader:
      _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
      folder_path: ${paths.ctx}
      name_pattern: .*
      verbose: false
  far_mean:
    _target_: src.sample_metric.MassingContextualRelevance
    _partial_: true
    massing_key: massing
    context_key: context_ids_100
    additional_features: [site_contour]
    id_key: id
    context_reduction: mean
    massing_metric:
      _target_: src.sample_metric.MassingFloorAreaRatio
      massing_key: massing
      site_key: site_contour
      floor_height: 3.0
    context_dataset_loader:
      _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
      folder_path: ${paths.ctx}
      name_pattern: .*
      verbose: false
  coverage_mean:
