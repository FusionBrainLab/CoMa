        massing_key: massing
        context_key: context_ids_100
        additional_features:
          - site_contour
        massing_metric:
          _target_: src.sample_metric.MassingCoverage
          massing_key: massing
          site_key: site_contour
        id_key: id
        context_dataset_loader:
          _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
          folder_path: ${oc.env:REPO_ROOT}/experiments/data_processing/coma/dataset/massings
          name_pattern: .*
          verbose: true
        context_reduction: mean
      gt_label_key: label
    SetbackMatch:
      _target_: src.metric.SampleMetricROCAUC
      sample_metric:
        _target_: src.sample_metric.MassingContextualRelevance
        massing_key: massing
        context_key: context_ids_100
        additional_features:
