        massing_key: massing
        context_key: context_ids_100
        additional_features:
          - site_contour
        massing_metric:
          _target_: src.sample_metric.MassingStepbackRatio
          massing_key: massing
        id_key: id
        context_dataset_loader:
          _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
          folder_path: ${oc.env:REPO_ROOT}/experiments/data_processing/coma/dataset/massings
          name_pattern: .*
          verbose: true
        context_reduction: mean
      gt_label_key: label
  eval_configs: 
    - _target_: src.validator.EvalConfig
      method_name: negative_sampling_testset
      metric_name: HeightMatch
    - _target_: src.validator.EvalConfig
      method_name: negative_sampling_testset
      metric_name: DirectionMatch
    - _target_: src.validator.EvalConfig
      method_name: negative_sampling_testset
      metric_name: CompactnessMatch
    - _target_: src.validator.EvalConfig
      method_name: negative_sampling_testset
      metric_name: PointsCountMatch
    - _target_: src.validator.EvalConfig
      method_name: negative_sampling_testset
      metric_name: PolygonsCountMatch
    - _target_: src.validator.EvalConfig
      method_name: negative_sampling_testset
      metric_name: BuildingsCountMatch
    - _target_: src.validator.EvalConfig
      method_name: negative_sampling_testset
      metric_name: FARMatch
    - _target_: src.validator.EvalConfig
      method_name: negative_sampling_testset
      metric_name: CoverageMatch
    - _target_: src.validator.EvalConfig
      method_name: negative_sampling_testset
      metric_name: SetbackMatch
    - _target_: src.validator.EvalConfig
      method_name: negative_sampling_testset
      metric_name: ElongationMatch
    - _target_: src.validator.EvalConfig
      method_name: negative_sampling_testset
      metric_name: CourtyardRatioMatch
    - _target_: src.validator.EvalConfig
      method_name: negative_sampling_testset
