defaults:
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

method:
  _target_: src.validator.Validator
  _convert_: all
  submit_loaders:
    negative_sampling_testset:
      _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
      folder_path: ${oc.env:REPO_ROOT}/experiments/benchmarks/coma/metrics_validation/dataset
      name_pattern: .*
      verbose: true
  metrics:
    HeightMatch:
      _target_: src.metric.SampleMetricROCAUC
      sample_metric:
        _target_: src.sample_metric.MassingContextualRelevance
        massing_key: massing
        context_key: context_ids_100
        additional_features:
          - site_contour
        massing_metric:
          _target_: src.sample_metric.MassingBuildingsMetric
          massing_key: massing
          building_metric:
            _target_: src.sample_metric.BuildingFloorCount
            building_key: building
            floor_height: 3.0
          building_key: building
          reduction: mean
          wrap_to_massing: false
        id_key: id
        context_dataset_loader:
          _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
          folder_path: ${oc.env:REPO_ROOT}/experiments/data_processing/coma/dataset/massings
          name_pattern: .*
          verbose: true
        context_reduction: mean
      gt_label_key: label
    DirectionMatch:
      _target_: src.metric.SampleMetricROCAUC
      sample_metric:
        _target_: src.sample_metric.MassingContextualRelevance
        massing_key: massing
        context_key: context_ids_100
        additional_features:
          - site_contour
        massing_metric:
          _target_: src.sample_metric.MassingFootprintsMetric
          massing_key: massing
          polygons_metric:
            _target_: src.polygons_analyzer.DirectionPA
          reduction: mean
        id_key: id
        context_dataset_loader:
          _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
          folder_path: ${oc.env:REPO_ROOT}/experiments/data_processing/coma/dataset/massings
          name_pattern: .*
          verbose: true
        context_reduction: nearest
      gt_label_key: label
    CompactnessMatch:
      _target_: src.metric.SampleMetricROCAUC
      sample_metric:
        _target_: src.sample_metric.MassingContextualRelevance
        massing_key: massing
        context_key: context_ids_100
        additional_features:
          - site_contour
        massing_metric:
          _target_: src.sample_metric.MassingPolygonsMetric
          massing_key: massing
          polygons_metric:
            _target_: src.polygons_analyzer.CircularityPA
          reduction: mean
        id_key: id
        context_dataset_loader:
          _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
          folder_path: ${oc.env:REPO_ROOT}/experiments/data_processing/coma/dataset/massings
          name_pattern: .*
          verbose: true
        context_reduction: mean
      gt_label_key: label
    PointsCountMatch:
      _target_: src.metric.SampleMetricROCAUC
      sample_metric:
        _target_: src.sample_metric.MassingContextualRelevance
        massing_key: massing
        context_key: context_ids_100
        additional_features:
          - site_contour
        massing_metric:
          _target_: src.sample_metric.MassingElementsCounter
          massing_key: massing
          element: point
        id_key: id
        context_dataset_loader:
          _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
          folder_path: ${oc.env:REPO_ROOT}/experiments/data_processing/coma/dataset/massings
          name_pattern: .*
          verbose: true
        context_reduction: mean
      gt_label_key: label
    PolygonsCountMatch:
      _target_: src.metric.SampleMetricROCAUC
      sample_metric:
        _target_: src.sample_metric.MassingContextualRelevance
        massing_key: massing
        context_key: context_ids_100
        additional_features:
          - site_contour
        massing_metric:
          _target_: src.sample_metric.MassingElementsCounter
          massing_key: massing
          element: polygon
        id_key: id
        context_dataset_loader:
          _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
          folder_path: ${oc.env:REPO_ROOT}/experiments/data_processing/coma/dataset/massings
