defaults:
  - feature_pool: coma            # shared 17-feature pool -> ${_feature_pool}
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

# Use the trained learned metric as a validator on a (new) dataset, via the
# repo's standard Validator flow. The learned metric is a plain SampleMetric, so
# nothing here is special-cased. Retarget to a new dataset with overrides, e.g.:
#   paths.val=/path/to/new/testset paths.ctx=/path/to/new/context
paths:
  base: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/sshk/massing-metric
  ctx: ${paths.base}/experiments/data_processing/coma/dataset/massings
  val: ${paths.base}/experiments/benchmarks/coma/metrics_validation/dataset
  results: ${paths.base}/experiments/benchmarks/coma/metrics_validation/results
  models: ${paths.base}/experiments/benchmarks/coma/metrics_validation/models

method:
  _target_: src.validator.Validator
  _convert_: all
  submit_loaders:
    target_dataset:
      _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
      folder_path: ${paths.val}
      name_pattern: .*
      verbose: true
  metrics:
    LearnedEnsembleROCAUC:
      _target_: src.metric.SampleMetricROCAUC
      gt_label_key: label
      sample_metric:
        _target_: src.sample_metric.LearnedEnsembleMetric
        model_path: ${paths.models}/learned_ensemble_catboost_all17.joblib
        feature_metrics: ${_feature_pool}
    LearnedEnsembleF1:
      _target_: src.metric.SampleMetricF1
      gt_label_key: label
      sample_metric:
        _target_: src.sample_metric.LearnedEnsembleMetric
        model_path: ${paths.models}/learned_ensemble_catboost_all17.joblib
        feature_metrics: ${_feature_pool}
  eval_configs:
    - {_target_: src.validator.EvalConfig, method_name: target_dataset, metric_name: LearnedEnsembleROCAUC}
    - {_target_: src.validator.EvalConfig, method_name: target_dataset, metric_name: LearnedEnsembleF1}
  result_storage_path: ${paths.results}/learned_metric_validation.json
