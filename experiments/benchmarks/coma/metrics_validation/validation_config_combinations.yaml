defaults:
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

method:
  _target_: src.validator.Validator
  _convert_: all
  submit_loaders:
    negative_sampling_testset:
      _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
      folder_path: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/sshk/massing-metric/experiments/benchmarks/coma/metrics_validation/dataset
      name_pattern: .*
      verbose: true
  metrics:
    Height__mean:
      _target_: src.metric.SampleMetricROCAUC
      sample_metric:
        _target_: src.sample_metric.MassingContextualRelevance
        massing_key: massing
        context_key: context_ids_100
        additional_features:
        - site_contour
        massing_metric: &id001
          _target_: src.sample_metric.MassingBuildingsMetric
          massing_key: massing
          building_metric:
            _target_: src.sample_metric.BuildingFloorCount
            building_key: building
            floor_height: 3.0
          building_key: building
          reduction: mean
          wrap_to_massing: false
        id_key: id
        context_dataset_loader:
          _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
          folder_path: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/sshk/massing-metric/experiments/data_processing/coma/dataset/massings
          name_pattern: .*
          verbose: false
        context_reduction: mean
      gt_label_key: label
    Height__nearest:
      _target_: src.metric.SampleMetricROCAUC
      sample_metric:
        _target_: src.sample_metric.MassingContextualRelevance
        massing_key: massing
        context_key: context_ids_100
        additional_features:
        - site_contour
        massing_metric: *id001
        id_key: id
        context_dataset_loader:
          _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
          folder_path: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/sshk/massing-metric/experiments/data_processing/coma/dataset/massings
          name_pattern: .*
