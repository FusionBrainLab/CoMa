defaults:
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

method: 
  _target_: src.core.function_utils.FunctionGraph
  _convert_: all
  functions:
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
        folder_path: "${oc.env:REPO_ROOT}/experiments/data_processing/coma/dataset/massings"
        name_pattern: ".*"
        verbose: true
      output_parser:
        _target_: src.core.parsers.AnyToDictParser
        key: base_dataset
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.dataset_processor.UniformColumnShuffler
        shuffle_col: "context_ids_100"
        label_col: "label"
      input_parser:
        _target_: src.core.parsers.DictToDictParser
        keys_mapping: {"dataset": "base_dataset"}
      output_parser:
        _target_: src.core.parsers.AnyToDictParser
        key: shuffled_dataset
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.dataset_handler.InversedJsonChunkDatasetSaver
        folder_path: "${oc.env:REPO_ROOT}/experiments/benchmarks/coma/metrics_validation/dataset"
        chunk_length: 10000
      input_parser:
        _target_: src.core.parsers.DictToDictParser
        keys_mapping: {"dataset": "shuffled_dataset"}