defaults:
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .
  sweep:
    dir: .
    subdir: .
  sweeper:
    max_batch_size: 1
  
paths:
  results: ${oc.env:REPO_ROOT}/experiments/benchmarks/coma/results
  image: ${oc.env:REPO_ROOT}/experiments/benchmarks/coma/results_visualization/visualizations/multimodal_contour_grid.png

method:
  _target_: src.core.function_utils.FunctionGraph
  _convert_: all
  functions:
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.dataset_creator.ValidationResultsLoader
        results_folder: ${paths.results}
        submit_name_to_dict_deserializer:
          _target_: src.string_deserializer.RegexArgsDeserializer
          args_expressions:
            train_type: "train-(.+?)_model-"
            model_size: "model-([0-9]+)B"
            context_1d_count: "1d([0-9]+)"
            context_2d_count: "2d([0-9]+)"
            context_3d_count: "3d([0-9]+)"
          numeric_args:
            model_size: "int"
            context_1d_count: "int"
            context_2d_count: "int"
            context_3d_count: "int"
      output_parser:
        _target_: src.core.parsers.AnyToDictParser
        key: dataset
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.save_visualizer.SaveImageVisualizer
        image_visualizer:
          _target_: src.image_data_visualizer.ContourHeatmapGridDatasetVisualizer
          dataset_key: dataset
          x_feature: context_1d_count
          y_feature: context_3d_count
          value_feature: contextual_relevance
          x_grid_feature: model_size
          y_grid_feature: context_2d_count
          title: null
          feature_renaming:
            context_1d_count: "1D Context"
            context_3d_count: "3D Context"
            model_size: "Model Size"
            context_2d_count: "2D Context count"
            contextual_relevance: "Contextual Relevance"
          palette: "viridis"
          fixed_features:
            train_type: multimodal_context
        path: ${paths.image}
      input_parser:
        _target_: src.core.parsers.AnyToDictParser
        key: data