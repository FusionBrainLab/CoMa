defaults:
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .
  sweep:
    dir: .
    subdir: .
  sweeper:
    max_batch_size: 1
  
context_2d_count: 1
context_3d_count: 1
  
method:
  _target_: src.core.function_utils.FunctionGraph
  _convert_: all
  functions:
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.dataset_creator.ValidationResultsLoader
        results_folder: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/massing_generation/experiments/benchmarks/coma/results
        submit_name_to_dict_deserializer:
          _target_: src.string_deserializer.RegexArgsDeserializer
          args_expressions:
            train_type: "train-(.+?)_model-"
            model_size: "model-([0-9]+)B"
            context_1d_count: "1d([0-9]+)"
            context_2d_count: "2d([0-9]+)"
            context_3d_count: "3d([0-9]+)"
          numeric_args:
            model_size: "int"
            context_1d_count: "int"
            context_2d_count: "int"
            context_3d_count: "int"
      output_parser:
        _target_: src.core.parsers.AnyToDictParser
        key: dataset
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.save_visualizer.SaveImageVisualizer
        image_visualizer:
          _target_: src.image_data_visualizer.ContourHeatmapDatasetVisualizer
          dataset_key: dataset
          x_feature: model_size
          y_feature: context_1d_count
          value_feature: contextual_relevance
          title: "Contextual Relevance Heatmap by Model Size and 1D Context Count for 2d context count = ${context_2d_count} and 3d context count = ${context_3d_count}"
          feature_renaming:
            model_size: "Model Size"
            context_1d_count: "1D Context"
            contextual_relevance: "Contextual Relevance"
          palette: "viridis"
          fixed_features:
            train_type: multimodal_context
            context_2d_count: ${context_2d_count}
            context_3d_count: ${context_3d_count}
        path: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/massing_generation/experiments/benchmarks/coma/results_visualization/visualizations/multimodal_contour/model_1d/3d${context_3d_count}_2d${context_2d_count}.png
      input_parser:
        _target_: src.core.parsers.AnyToDictParser
        key: data