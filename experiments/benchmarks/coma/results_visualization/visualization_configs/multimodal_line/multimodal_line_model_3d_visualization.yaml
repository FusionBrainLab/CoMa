defaults:
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

context_2d_count: 1
context_1d_count: 1
x_feature: model_size
line_feature: context_3d_count
  
method:
  _target_: src.core.function_utils.FunctionGraph
  _convert_: all
  functions:
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.dataset_creator.ValidationResultsLoader
        results_folder: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/massing_generation/experiments/benchmarks/coma/results
        submit_name_to_dict_deserializer:
          _target_: src.string_deserializer.RegexArgsDeserializer
          args_expressions:
            train_type: "train-(.+?)_model-"
            model_size: "model-([0-9]+)B"
            context_1d_count: "1d([0-9]+)"
            context_2d_count: "2d([0-9]+)"
            context_3d_count: "3d([0-9]+)"
          numeric_args:
            model_size: "int"
            context_1d_count: "int"
            context_2d_count: "int"
            context_3d_count: "int"
      output_parser:
        _target_: src.core.parsers.AnyToDictParser
        key: dataset
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.save_visualizer.SaveImageVisualizer
        image_visualizer:
          _target_: src.image_data_visualizer.MultiLineDatasetVisualizer
          dataset_key: dataset
          x_feature: ${x_feature}
          y_feature: contextual_relevance
          line_feature: ${line_feature}
          title: "Contextual Relevance Dynamic by ${x_feature} on ${line_feature} for 2d context count = ${context_2d_count} and 1d context count = ${context_1d_count}"
          feature_renaming:
            ${x_feature}: "${x_feature}"
            ${line_feature}: "${line_feature}"
            contextual_relevance: "Contextual Relevance"
          fixed_features:
            train_type: multimodal_context
            context_2d_count: ${context_2d_count}
            context_1d_count: ${context_1d_count}
        horizontal_lines:
          "No Context":
            train_type: no_context
            context_1d_count: 0
            context_2d_count: 0
            context_3d_count: 0
        path: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/massing_generation/experiments/benchmarks/coma/results_visualization/visualizations/multimodal_line/model_3d_${x_feature}/1d${context_1d_count}_2d${context_2d_count}.png
      input_parser:
        _target_: src.core.parsers.AnyToDictParser
        key: data