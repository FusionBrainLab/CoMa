defaults:
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .
  sweep:
    dir: .
    subdir: .
  sweeper:
    max_batch_size: 1

method:
  _target_: src.core.function_utils.FunctionGraph
  _convert_: all
  functions:
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.dataset_creator.PreprocessDatasetCreator
        base_creator:
          _target_: src.dataset_creator.ValidationResultsLoader
          results_folder: ${oc.env:MASSING_METRIC_ROOT,${oc.env:REPO_ROOT}}/experiments/benchmarks/coma/results
          submit_name_to_dict_deserializer:
            _target_: src.string_deserializer.RegexArgsDeserializer
            args_expressions:
              train_type: "train-(.+?)_model-"
              model_size: "model-([0-9]+)B"
              context_1d_count: "1d([0-9]+)"
              context_2d_count: "2d([0-9]+)"
              context_3d_count: "3d([0-9]+)"
            numeric_args:
              model_size: "int"
              context_1d_count: "int"
              context_2d_count: "int"
              context_3d_count: "int"
        preprocessor:
          _target_: src.dataset_processor.CompositionProcessor
          base_processors:
            - _target_: src.dataset_processor.UnsqueezeFeatureCreator
              feature_values: [
                {context_2d_count: 0, context_3d_count: 0},
                {context_1d_count: 0, context_3d_count: 0},
                {context_1d_count: 0, context_2d_count: 0}
              ]
              new_feature_col: inference_type
              old_feature_value: "multimodal"
              new_feature_value: "unimodal"
            - _target_: src.dataset_processor.SqueezeFeatureCreator
              cols: [context_1d_count, context_2d_count, context_3d_count]
              fixed_feature_values:
                "1D Context": {context_2d_count: 0, context_3d_count: 0}
                "2D Context": {context_1d_count: 0, context_3d_count: 0}
                "3D Context": {context_1d_count: 0, context_2d_count: 0}
              fixed_feature_col: context_modality
              value_feature_col: context_count
              filter_rows: false
      output_parser:
        _target_: src.core.parsers.AnyToDictParser
        key: dataset
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.save_visualizer.SaveFigureVisualizer
        figure_visualizer:
          _target_: src.figure_data_visualizer.MultiLineGridFigureVisualizer
          dataset_key: dataset
          x_feature: context_count
          y_feature: contextual_relevance
          x_grid_feature: context_modality
          y_grid_feature: train_type
          line_features:
            - model_size
            - inference_type
          title: null
          feature_renaming:
            context_count: "Context Count"
            model_size: "Model Size"
            context_modality: "Context Modality"
            train_type: "Train Type"
            inference_type: "Inference Type"
            contextual_relevance: "Contextual Relevance"
          legend_renaming:
            model_size:
              2: 2B
              4: 4B
              8: 8B
            inference_type:
              unimodal: "Unimodal Inference"
              multimodal: "Multimodal Inference"
            train_type:
              unimodal_context: "Unimodal Context"
              multimodal_context: "Multimodal Context"
          fixed_features:
            train_type: multimodal_context
          horizontal_lines:
            "No Context-2B":
              train_type: no_context
              model_size: 2
              context_1d_count: 0
              context_2d_count: 0
              context_3d_count: 0
            "No Context-4B":
              train_type: no_context
              model_size: 4
              context_1d_count: 0
              context_2d_count: 0
              context_3d_count: 0
            "No Context-8B":
              train_type: no_context
              model_size: 8
              context_1d_count: 0
              context_2d_count: 0
              context_3d_count: 0
          show_confidence_interval: true
          include_horizontal_line_samples: false
          palette: "tab10"
          horizontal_lines_palette: "Dark2"
          horizontal_lines_color_feature: model_size
          figure_width_inches: 5.4567
          figure_height_inches: 3.3
          panel_face_color: "white"
          share_y_axis: true
          line_width: 1.1
          marker_size: 3.2
          tick_font_size: 7.0
          label_font_size: 8.0
          panel_title_font_size: 8.5
          legend_font_size: 7.5
          legend_title: null
          legend_max_columns: 3
          column_title_template: "{feature}=\n{value}"
          row_title_template: "{feature}=\n{value}"
          reference_font_size: 6.5
          reference_label_mode: "legend"
          reference_line_width: 0.9
          max_x_ticks: 6
          max_y_ticks: 10
          integer_x_ticks: false
        path: ${oc.env:MASSING_METRIC_ROOT,${oc.env:REPO_ROOT}}/experiments/benchmarks/coma/results_visualization/visualizations_publication/multimodal_line_grid
        formats: ["pgf", "pdf", "png"]
        dpi: 600.0
        font_family: "sans-serif"
        pgf_texsystem: "pdflatex"
        pgf_preamble:
          - "\\usepackage[utf8]{inputenc}"
          - "\\usepackage[T1]{fontenc}"
          - "\\usepackage{lmodern}"
      input_parser:
        _target_: src.core.parsers.AnyToDictParser
        key: data
