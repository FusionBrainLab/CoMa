defaults:
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

x_feature: context_1d_count
model_size: 4
zero_feature_1: context_2d_count
zero_feature_2: context_3d_count
  
method:
  _target_: src.core.function_utils.FunctionGraph
  _convert_: all
  functions:
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.dataset_creator.ValidationResultsLoader
        results_folder: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/massing_generation/experiments/benchmarks/coma/results
        submit_name_to_dict_deserializer:
          _target_: src.string_deserializer.RegexArgsDeserializer
          args_expressions:
            train_type: "train-(.+?)_model-"
            model_size: "model-([0-9]+)B"
            context_1d_count: "1d([0-9]+)"
            context_2d_count: "2d([0-9]+)"
            context_3d_count: "3d([0-9]+)"
          numeric_args:
            model_size: "int"
            context_1d_count: "int"
            context_2d_count: "int"
            context_3d_count: "int"
      output_parser:
        _target_: src.core.parsers.AnyToDictParser
        key: dataset
    - _target_: src.core.function_utils.FunctionWrapper
      function:
        _target_: src.save_visualizer.SaveImageVisualizer
        image_visualizer:
          _target_: src.image_data_visualizer.MultiLineDatasetVisualizer
          dataset_key: dataset
          x_feature: ${x_feature}
          y_feature: contextual_relevance
          line_feature: train_type
          title: "Contextual Relevance Dynamic by ${x_feature} on train type for Qwen3-VL-${model_size}B"
          feature_renaming:
            ${x_feature}: "${x_feature}"
            train_type: "Train Type"
            contextual_relevance: "Contextual Relevance"
          fixed_features:
            model_size: ${model_size}
            ${zero_feature_1}: 0
            ${zero_feature_2}: 0
        horizontal_lines:
          "No Context":
            train_type: no_context
            model_size: ${model_size}
            context_1d_count: 0
            context_2d_count: 0
            context_3d_count: 0
        path: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/massing_generation/experiments/benchmarks/coma/results_visualization/visualizations/crossmodal_line/${x_feature}_${model_size}B.png
      input_parser:
        _target_: src.core.parsers.AnyToDictParser
        key: data