          direction_nearest:
            _target_: src.sample_metric.MassingContextualRelevance
            massing_key: pred_massing
            context_key: context_ids_100
            additional_features: [site_contour]
            id_key: id
            context_reduction: nearest
            massing_metric:
              _target_: src.sample_metric.MassingFootprintsMetric
              massing_key: massing
              reduction: mean
              polygons_metric: {_target_: src.polygons_analyzer.DirectionPA}
            context_dataset_loader:
              _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
              folder_path: ${paths.ctx}
              name_pattern: .*
              verbose: false
          far_mean:
            _target_: src.sample_metric.MassingContextualRelevance
