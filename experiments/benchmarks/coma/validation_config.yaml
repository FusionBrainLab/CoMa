defaults:
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .
  sweep:
    dir: .
    subdir: .
  sweeper:
    max_batch_size: 1

train_type: multimodal_context
model_size: 4
context_1d_count: 10
context_2d_count: 1
context_3d_count: 8

paths:
  ctx: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/massing_generation/experiments/data_processing/coma/dataset/massings
  
method:
  _target_: src.validator.Validator
  _convert_: all
  submit_loaders:
    submit:
      _target_: src.dataset_creator.InversedJsonChunkDatasetLoader
      folder_path: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/massing_generation/experiments/benchmarks/coma/methods_validation/${train_type}/${model_size}B/1d${context_1d_count}_2d${context_2d_count}_3d${context_3d_count}
      name_pattern: ".*"
      verbose: true
  metrics:
    contextual_relevance:
      _target_: src.metric.SafeIgnoreSampleMerging
      sample_metric:
        _target_: src.sample_metric.LearnedEnsembleMetric
        model_path: /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/massing_generation/experiments/benchmarks/coma/metrics_validation/models/learned_ensemble_catboost_all17.joblib
