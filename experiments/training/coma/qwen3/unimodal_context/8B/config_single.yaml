defaults:
  - ../../configs/model/qwen3_8b@model
  - ../../configs/processor/qwen3_8b@processor
  - ../../configs/tokenizer_creator/qwen3_8b@tokenizer_creator
  - ../../configs/context_sampler/unimodal_context@context_sampler
  - ../../configs/memory_creator/unimodal_context@memory_creator
  - ../../configs/base_single@_here_
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

training:
  output_dir: "${oc.env:REPO_ROOT}/experiments/training/coma/qwen3/unimodal_context/8B/checkpoints"
  logging_dir: "${oc.env:REPO_ROOT}/experiments/training/coma/qwen3/unimodal_context/8B/logs"
