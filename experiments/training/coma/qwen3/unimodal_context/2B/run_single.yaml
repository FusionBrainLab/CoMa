job:
  description: "#evgmaslov #coma #unimodal_context #2B"
  environment:
    image: cr.ai.cloud.ru/aicloud-base-images/py3.12-torch2.7.0:0.0.41
    variables:
      HF_HOME: "/mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/transformers_cache"
      CUDA_HOME: "/mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/envs/massing_generation"
  resource:
    instance_type: a100plus.1gpu.80vG.12C.182G
    # processes: - # Сколько процессов запускать. По умолчанию запускается по количеству GPU на одном воркере - это подходит для torchrun.
    processes: 1 # Для работы с accelerate нужно запускать 1 процесс на 1 воркер.
    workers: 1   # Сколько запускать воркеров запускать
  script: '/mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/envs/massing_generation/bin/python /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/massing_generation/hydra_run.py --config_path /mnt/virtual_ai0001071-04017_SR004-nfs1/CFS-SR008/workspace/maslov/massing_generation/experiments/training/coma/qwen3/unimodal_context/2B/config_single.yaml'
  type: binary


