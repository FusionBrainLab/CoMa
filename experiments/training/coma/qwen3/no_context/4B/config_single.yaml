defaults:
  - ../../configs/model/qwen3_4b@model
  - ../../configs/processor/qwen3_4b@processor
  - ../../configs/tokenizer_creator/qwen3_4b@tokenizer_creator
  - ../../configs/context_sampler/no_context@context_sampler
  - ../../configs/memory_creator/no_context@memory_creator
  - ../../configs/base_single@_here_
  - override /hydra/job_logging: disabled
  - override /hydra/hydra_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

training:
  output_dir: "${oc.env:REPO_ROOT}/experiments/training/coma/qwen3/no_context/4B/checkpoints"
  logging_dir: "${oc.env:REPO_ROOT}/experiments/training/coma/qwen3/no_context/4B/logs"
